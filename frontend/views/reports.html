
<div class="container-fluid page-header mb-5 position-relative overlay-bottom">
    <div class="d-flex flex-column align-items-center justify-content-center pt-0 pt-lg-5" style="min-height: 150px">
    </div>
</div>

<div class="container-fluid pt-5">
    <div class="container">
        <div class="section-title">
            <h4 class="text-primary text-uppercase" style="letter-spacing: 5px;">Mesečni Izveštaji</h4>
            <h1 class="display-4">Pregled Prodaje</h1>
        </div>

        <!-- Month Selection -->
        <div class="row mb-4">
            <div class="col-md-6">
                <label for="monthSelect" class="form-label">Izaberite Mesec:</label>
                <input type="month" id="monthSelect" class="form-control" />
            </div>
            <div class="col-md-6 d-flex align-items-end">
                <button id="generateReport" class="btn btn-primary btn-lg">Generiši Izveštaj</button>
            </div>
        </div>

        <!-- Tabs -->
        <ul class="nav nav-tabs" id="reportTabs" role="tablist">
            <li class="nav-item">
                <a class="nav-link active" id="overview-tab" role="tab" style="cursor: pointer;">Pregled</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="products-tab" role="tab" style="cursor: pointer;">Proizvodi</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="employees-tab" role="tab" style="cursor: pointer;">Zaposleni</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="venues-tab" role="tab" style="cursor: pointer;">Objekti</a>
            </li>
        </ul>
        <!-- Tab Content -->
        <div class="tab-content mt-4" id="reportTabsContent">
            <!-- Overview Tab -->
            <div class="tab-pane fade show active" id="overview" role="tabpanel">
                <div class="row" id="overviewMetrics">
                    <!-- Will be populated by JS -->
                </div>
            </div>

            <!-- Products Tab -->
            <div class="tab-pane fade" id="products" role="tabpanel">
                <div class="table-responsive">
                    <table class="table table-striped" id="productsTable">
                        <thead class="thead-dark">
                            <tr>
                                <th>Proizvod</th>
                                <th class="text-right">Količina</th>
                                <th class="text-right">Prihod</th>
                                <th class="text-right">Trošak</th>
                                <th class="text-right">Dobit</th>
                                <th class="text-right">Marža</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Will be populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Employees Tab -->
            <div class="tab-pane fade" id="employee" role="tabpanel">
                <div class="table-responsive">
                    <table class="table table-striped" id="employeesTable">
                        <thead class="thead-dark">
                            <tr>
                                <th>Zaposleni</th>
                                <th class="text-right">Smene</th>
                                <th class="text-right">Dana</th>
                                <th class="text-right">Prodato</th>
                                <th class="text-right">Prihod</th>
                                <th class="text-right">Dobit</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Will be populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Venues Tab -->
            <div class="tab-pane fade" id="venues" role="tabpanel">
                <div class="table-responsive">
                    <table class="table table-striped" id="venuesTable">
                        <thead class="thead-dark">
                            <tr>
                                <th>Objekat</th>
                                <th class="text-right">Dnevni Trošak</th>
                                <th class="text-right">Dana</th>
                                <th class="text-right">Smene</th>
                                <th class="text-right">Ukupan Trošak</th>
                                <th class="text-right">Prihod</th>
                                <th class="text-right">Neto Dobit</th>
                                <th class="text-right">ROI</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Will be populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="text-center mt-5" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="sr-only">Loading...</span>
            </div>
        </div>
    </div>
</div>
