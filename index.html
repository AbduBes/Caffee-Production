<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>KOPPEE - Coffee Shop HTML Template</title>
    <meta content="width=device-width, initial-scale=1.0">


    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">


    <!-- Customized Bootstrap Stylesheet -->
    <link href="frontend/assets/css/style.min.css" rel="stylesheet">
    <link href="frontend/assets/css/style.css" rel="stylesheet">

    <link href="frontend/assets/css/dataTables.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="frontend/assets/css/toastr.min.css">
    <link href="frontend/assets/css/select2.min.css" rel="stylesheet" />

</head>

<body>
    <!-- Navbar Start -->
    <div class="container-fluid p-0 nav-bar">
        <nav class="navbar navbar-expand-lg bg-none navbar-dark py-3">
            <a href="index.html" class="navbar-brand px-lg-4 m-0">
                <h1 class="m-0 display-4 text-uppercase text-white">DSS COFFEE STOP</h1>
            </a>
            <button type="button" class="navbar-toggler" data-toggle="collapse" data-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-between" id="navbarCollapse">
                <div id="navbar" class="navbar-nav ml-auto p-4">
                    <a href="#login" class="nav-item nav-link active" id="auth-link">Log in</a>
                </div>
            </div>
        </nav>
    </div>
    <!-- Navbar End -->

    <section id="pageContent">
        <main id="spapp" role="main">

            <section id="login" data-load="login.html">
            </section>
            <section id="admin" data-load="admin.html">
            </section>
            <section id="employees" data-load="employees.html">
            </section>
            <section id="reports" data-load="reports.html">
            </section>
        </main>
    </section>



    <!-- Footer Start -->
    <div class="container-fluid footer text-white mt-5 pt-5 px-0 position-relative overlay-top">
    </div>
    <!-- Footer End -->

    <!-- jQuery FIRST -->
    <script src="frontend/assets/js/jquery.min.js"></script>

    <!-- SPA router -->
    <script src="frontend/assets/js/jquery.spapp.min.js"></script>

    <!-- jQuery validation -->
    <script src="frontend/assets/js/jquery.validate.min.js"></script>

    <!-- Toastr -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="frontend/assets/js/bootstrap.bundle.min.js"></script>

    <!-- App utils -->
    <script src="frontend/utils/constants.js"></script>
    <script src="frontend/utils/rest-client.js"></script>
    <script src="frontend/utils/utils.js"></script>

    <!-- Services -->
    <script src="frontend/services/user-service.js"></script>
    <script src="frontend/services/admin-service.js"></script>
    <script src="frontend/services/radnici-service.js"></script>
    <script src="frontend/services/reports-service.js"></script>

    <!-- SPA init (LAST) -->
    <script src="frontend/assets/js/script.js"></script>

    <script>
        $(document).ready(function () {
            UserService.generateMenuItems();
        });
